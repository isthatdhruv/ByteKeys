name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Byte-compile
        run: python -m compileall -q bytekeys tests tools
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v

  gui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0
      - name: PySide6
        run: python -m pip install PySide6-Essentials
      - name: GUI tests (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
          BYTEKEYS_QT: pyside6
        run: python -m unittest tests.test_gui -v

  packages:
    runs-on: ubuntu-24.04
    needs: [test, gui]
    steps:
      - uses: actions/checkout@v4
      - name: Build .deb
        run: packaging/deb/build-deb.sh
      - name: Build AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: packaging/appimage/build-appimage.sh
      - name: Smoke test
        run: |
          dpkg-deb --info dist/*.deb
          APPIMAGE_EXTRACT_AND_RUN=1 ./dist/ByteKeys-*-x86_64.AppImage cli --version
      - uses: actions/upload-artifact@v4
        with:
          name: bytekeys-packages
          path: dist/*
