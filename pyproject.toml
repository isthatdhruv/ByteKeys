[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "bytekeys"
dynamic = ["version"]
description = "Keyboard lighting, fans and performance modes for Linux laptops"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
authors = [{ name = "The ByteKeys contributors" }]
keywords = ["keyboard", "backlight", "rgb", "led", "laptop", "linux", "fan", "performance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware",
]
# The service and the command line tool only need the standard library.
dependencies = []

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.5"]

[project.scripts]
bytekeys = "bytekeys.cli:main"
bytekeysd = "bytekeys.daemon:main"

[project.gui-scripts]
bytekeys-gui = "bytekeys.gui.app:main"

[project.urls]
Homepage = "https://github.com/isthatdhruv/ByteKeys"
Issues = "https://github.com/isthatdhruv/ByteKeys/issues"

[tool.setuptools.dynamic]
version = { attr = "bytekeys.__version__" }

[tool.setuptools.packages.find]
include = ["bytekeys*"]

[tool.setuptools.package-data]
"bytekeys.gui" = ["assets/*.png"]
